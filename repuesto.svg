<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180"
     role="img" aria-label="Imagen de repuesto: Modo Veyon">
    <defs>
        <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1b2436"/>
            <stop offset="1" stop-color="#0f1522"/>
        </linearGradient>
        <pattern id="rayas" width="18" height="18" patternUnits="userSpaceOnUse"
                 patternTransform="rotate(45)">
            <rect width="9" height="18" fill="#ffffff" fill-opacity=".035"/>
        </pattern>
    </defs>

    <!-- Fondo liso con trama diagonal: no se adivina qué había detrás -->
    <rect width="320" height="180" fill="url(#fondo)"/>
    <rect width="320" height="180" fill="url(#rayas)"/>

    <!-- Marco de puntos: el habitual de las imágenes que no se muestran -->
    <rect x="7" y="7" width="306" height="166" rx="12"
          fill="none" stroke="#26314a" stroke-width="5" stroke-dasharray="18 11"/>

    <!-- Ojo tachado -->
    <path d="M160 44c-44 0-78 26-92 38 14 12 48 38 92 38s78-26 92-38c-14-12-48-38-92-38z"
          fill="none" stroke="#8b97ad" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="160" cy="82" r="17" fill="#8b97ad"/>
    <line x1="92" y1="34" x2="228" y2="130"
          stroke="#f87171" stroke-width="10" stroke-linecap="round"/>

    <text x="160" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="17"
          letter-spacing="6" text-anchor="middle" fill="#5eead4">VEYON</text>
</svg>
