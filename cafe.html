<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máquina de Café</title>
    <link rel="stylesheet" href="assets/css/cafe.css">
</head>
<body>
    <header>
        <h1>☕ Máquina de Café</h1>
    </header>

    <div class="machine">
        <div class="steam" id="steam">💨</div>
        <div class="cup">
            <div class="coffee" id="coffee"></div>
        </div>
        <button id="brewBtn" onclick="brewCoffee()">Preparar Café</button>
        <p id="status">Pulsa el botón para preparar tu café</p>
    </div>

    <footer>
        <p>&copy; 2026 Mi Máquina de Café</p>
    </footer>

    <script src="assets/js/cafe.js"></script>
</body>
</html>
